<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">Yuanweimin profile photo card</title>
  <desc id="desc">A clean academic profile card with a portrait photo over a soft gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7ebcc"/>
      <stop offset="0.52" stop-color="#dff3f0"/>
      <stop offset="1" stop-color="#e4e8fb"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <clipPath id="portraitClip">
      <rect x="96" y="106" width="448" height="548" rx="18"/>
    </clipPath>
  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>
  <path d="M0 105 640 0v150L0 255Z" fill="#ffffff" opacity=".42"/>
  <path d="M0 640 640 492v160L0 800Z" fill="#ffffff" opacity=".26"/>
  <rect x="96" y="106" width="448" height="548" rx="18" fill="url(#panel)" opacity=".9"/>
  <image href="ywm.jpeg" x="96" y="106" width="448" height="548" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)"/>
  <rect x="96" y="106" width="448" height="548" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".72" stroke-width="8"/>
</svg>
